name: integration-test

on:
  check_run:
    types:
      - completed

jobs:
  test:
    if: github.event.check_run.name == 'Cloudflare Pages' && github.event.check_run.conclusion == 'success'
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26]
    steps:
      - name: Set commit status as pending
        uses: myrotvorets/set-commit-status-action@master
        with:
          description: Running integration tests
          sha: ${{ github.event.check_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          status: pending

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.check_run.head_sha }}

      - name: Set API_HOST
        uses: actions-ecosystem/action-regex-match@v2
        id: api-host
        with:
          text: ${{ github.event.check_run.external_id }}
          regex: '^([0-9a-f]+)-'

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run integration-test
        env:
          API_HOST: ${{ steps.api-host.outputs.group1 }}.liturgy-day.pages.dev

      - name: Report prod deployments
        run: |
          branchName="$(gh api -H 'Accept: application/vnd.github+json' \
            /repos/aensley/liturgy-day/check-suites/${CHECK_SUITE_ID} \
            --jq '.head_branch')"

          if [ "$branchName" = "main" ]; then
            curl -u ${ASSERTIBLE_DEPLOY_TOKEN}: "https://assertible.com/deployments" -d'{
                "service": "04fecc16-3562-4972-b580-0bc9b4f81d8a",
                "environment": "production",
                "version": "'${HEAD_SHA:0:7}'"
            }'
          fi

        env:
          ASSERTIBLE_DEPLOY_TOKEN: ${{ secrets.ASSERTIBLE_DEPLOY_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          CHECK_SUITE_ID: ${{ github.event.check_run.check_suite.id }}

      - name: Set final commit status
        uses: myrotvorets/set-commit-status-action@master
        if: always()
        with:
          description: Integration test ${{ job.status }}
          sha: ${{ github.event.check_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
