name: release

on: # Triggered by completed runs of the ci workflow on the main branch
  workflow_run:
    workflows:
      - "ci"
    branches:
      - main
    types:
      - completed

permissions:
  id-token: write  # Required for OIDC / NPM Trusted Publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' # only on success
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GHA_SEMANTIC_RELEASE_TOKEN }}
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds
          scope: '@aensley'
      - name: Install dependencies
        run: npm ci
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GHA_SEMANTIC_RELEASE_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Deploy to Cloudflare Pages
        run: curl -X POST "${CFP_DEPLOY_HOOK}"
        env:
          CFP_DEPLOY_HOOK: ${{ secrets.CFP_DEPLOY_HOOK }}
